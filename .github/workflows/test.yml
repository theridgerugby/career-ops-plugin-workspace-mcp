name: Plugin tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/checkout@v7
        with:
          repository: career-ops-hq/career-ops
          ref: b54c484e592bba35dcd399629e7a60d44312d36b
          path: .test-core
          persist-credentials: false
      - name: Dependency-free smoke tests
        run: npm test
      - name: Actual core readers with fictional data
        run: node test/smoke.mjs --code-root .test-core
